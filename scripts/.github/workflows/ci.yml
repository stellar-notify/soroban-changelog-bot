name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Regenerate fixtures (must match committed fixtures byte-for-byte)
        run: |
          node scripts/generate-fixtures.js
          git diff --exit-code fixtures/ || (echo "::error::fixtures/ are out of date - run 'node scripts/generate-fixtures.js' and commit the result" && exit 1)

      - name: Run unit + diff-pipeline tests against fixture WASM pairs
        run: npm test

      - name: Build action bundle
        run: npm run build

      - name: Verify bundle is committed and up to date
        run: |
          git diff --exit-code dist/ || (echo "::error::dist/ is out of date - run 'npm run build' and commit the result" && exit 1)

  self-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Run the action against a real testnet deployment pair
        uses: ./
        with:
          rpc-url: https://soroban-testnet.stellar.org
          contract-name: 'CI Self-Test Contract'
          previous-contract-id: ${{ vars.DEMO_CONTRACT_ID_V1 }}
          new-contract-id: ${{ vars.DEMO_CONTRACT_ID_V2 }}
          previous-tag: 'v1.0.0'
          new-tag: 'ci-self-test'
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true # demo contract vars are optional; see SETUP.md
